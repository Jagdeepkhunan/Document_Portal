<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img">
  <defs>
    <linearGradient id="ig1" x1="0" x2="1">
      <stop offset="0" stop-color="#00E0FF"/>
      <stop offset="1" stop-color="#7A5CFF"/>
    </linearGradient>

    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Portal Ring -->
  <g transform="translate(80,80)">
    <circle r="64" fill="none" stroke="url(#ig1)" stroke-width="6" filter="url(#g)"/>
    <circle r="44" fill="none" stroke="#ffffff18" stroke-width="1.5"/>
  </g>

  <!-- Centered Document -->
  <g transform="translate(80,80) translate(-34,-44)">
    <!-- back layer -->
    <rect x="0" y="8" width="68" height="88" rx="8" fill="#0b2340" opacity="0.8"/>

    <!-- front glowing sheet -->
    <rect x="6" y="0" width="62" height="88" rx="6" fill="url(#ig1)" opacity="0.95"/>

    <!-- folded corner -->
    <path d="M52 0 L68 16 L52 16 Z" fill="#ffffff20"/>

    <!-- lines -->
    <rect x="12" y="24" width="44" height="6" rx="3" fill="#ffffff" opacity="0.12"/>
    <rect x="12" y="42" width="34" height="6" rx="3" fill="#ffffff" opacity="0.10"/>
    <rect x="12" y="60" width="40" height="6" rx="3" fill="#ffffff" opacity="0.09"/>
  </g>

  <!-- Neon Spark -->
  <circle cx="118" cy="42" r="3.6" fill="#00ffd8" filter="url(#g)"/>
</svg>
