<!-- Futuristic Document Portal — Full Logo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Document Portal</title>
  <desc id="desc">Futuristic document icon combined with a portal ring and modern wordmark.</desc>

  <defs>
    <!-- gradients -->
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#00E0FF"/>
      <stop offset="0.5" stop-color="#4C6FFF"/>
      <stop offset="1" stop-color="#8A00FF"/>
    </linearGradient>

    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#0ff9c9"/>
      <stop offset="1" stop-color="#5a7bff"/>
    </linearGradient>

    <!-- soft outer glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- subtle stroke glow -->
    <filter id="innerGlow" x="-40%" y="-40%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="over"/>
    </filter>

    <!-- futuristic grid pattern -->
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0 L0 0 0 12" fill="none" stroke="#ffffff11" stroke-width="0.6"/>
    </pattern>

    <!-- crisp, modern sans-family fallback -->
    <style>
      .wordmark { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- background subtle panel -->
  <rect x="0" y="0" width="1000" height="360" rx="28" fill="url(#grid)" opacity="0.03"/>

  <!-- portal ring (semi-3d) -->
  <g transform="translate(120,180)">
    <path d="M0 -120 A120 120 0 1 1 0 120 A92 92 0 1 0 0 -120Z"
          fill="url(#g1)" opacity="0.18" filter="url(#glow)"/>
    <!-- ring highlight -->
    <path d="M0 -120 A120 120 0 0 1 77 -94" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- document icon (tilted, layered) -->
  <g transform="translate(140,110) rotate(-10)">
    <!-- back sheet -->
    <rect x="0" y="0" width="170" height="220" rx="14" fill="#07102a" opacity="0.7"/>
    <!-- front sheet with gradient + glow -->
    <rect x="6" y="-8" width="170" height="220" rx="12" fill="url(#g2)" transform="translate(0,0)"/>
    <rect x="6" y="-8" width="170" height="220" rx="12" fill="#ffffff" opacity="0.03"/>

    <!-- folded corner -->
    <path d="M152 -8 L170 10 L152 10 Z" fill="#ffffff22"/>

    <!-- data lines (neon segments) -->
    <g transform="translate(26,38)">
      <rect width="120" height="12" rx="6" fill="#ffffff" opacity="0.14"/>
      <rect y="30" width="95" height="12" rx="6" fill="#ffffff" opacity="0.12"/>
      <rect y="60" width="110" height="12" rx="6" fill="#ffffff" opacity="0.10"/>
      <rect y="90" width="70" height="12" rx="6" fill="#ffffff" opacity="0.09"/>
      <!-- glowing neon accents -->
      <rect width="120" height="6" rx="3" fill="url(#g1)" y="-6" opacity="0.9" transform="translate(0,0)"/>
      <rect y="30" width="80" height="6" rx="3" fill="url(#g1)" opacity="0.9"/>
    </g>
  </g>

  <!-- portal overlay ring (front) to create 'port' effect -->
  <g transform="translate(120,180)">
    <path d="M0 -140 A140 140 0 1 1 -1 140" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M0 -98 A98 98 0 1 0 0 98" fill="none" stroke="#ffffff13" stroke-width="2" stroke-dasharray="6 8"/>
  </g>

  <!-- small orbiting tech nodes -->
  <g transform="translate(80,60)">
    <circle cx="18" cy="18" r="6" fill="#00ffd8" opacity="0.9" filter="url(#glow)"/>
    <circle cx="200" cy="40" r="4" fill="#8a00ff" opacity="0.9" filter="url(#glow)"/>
    <circle cx="260" cy="190" r="3" fill="#4c6fff" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- wordmark: DOCUMENT PORTAL -->
  <text x="360" y="140" font-size="56" class="wordmark" fill="url(#g1)" style="text-shadow: 0 2px 10px rgba(0,0,0,0.25);">
    DOCUMENT
  </text>
  <text x="360" y="220" font-size="56" class="wordmark" fill="url(#g1)" style="letter-spacing:6px;">
    PORTAL
  </text>

  <!-- small tagline -->
  <text x="360" y="270" font-size="14" fill="#cfe7ff" opacity="0.8" font-family="Inter, Arial, sans-serif">
    Secure • Instant • Intelligent
  </text>
</svg>
